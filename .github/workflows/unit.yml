name: Unit Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit:
    name: Unit (jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # packages: read lets the install fetch the private @ubc packages this
    # repository has been given access to on GitHub Packages.
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # The agents framework (@ubc/genai-toolkit-agents-*) is on GitHub
          # Packages. Without this its tests are skipped.
          registry-url: https://npm.pkg.github.com
          scope: '@ubc'

      - name: Install dependencies
        # package-lock.json is gitignored in this repo (see playwright.yml), so we
        # use `npm install` rather than `npm ci`. The unit job needs no Mongo,
        # Qdrant, server, or browsers — it just runs jest against src/.
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests with coverage
        run: npm run test:unit:coverage

      - name: Upload unit coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: coverage-reports/unit/
          retention-days: 14
